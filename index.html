<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PyNux — Online Python Compiler</title>
  <meta name="description" content="PyNux is a free online Python compiler with a hacker-themed interface. Write, run, and test Python code directly in your browser." />
  <meta name="keywords" content="python, compiler, online, code editor, PyNux, hacker, terminal" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ════════════ LOADING SCREEN ════════════ -->
  <div id="loading-screen">
    <canvas id="matrix-canvas"></canvas>
    <div class="loader-logo">Py<span>Nux</span></div>
    <div class="loader-terminal">
      <div class="loader-terminal-bar">
        <i></i><i></i><i></i>
        <span>pynux@terminal</span>
      </div>
      <div class="loader-terminal-body" id="loader-lines"></div>
    </div>
    <div class="loader-progress">
      <div class="loader-progress-fill" id="loader-progress"></div>
    </div>
    <div class="loader-status" id="loader-status">Initializing...</div>
  </div>

  <!-- ════════════ MAIN APP ════════════ -->
  <div id="app">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-logo">Py<span>Nux</span></div>
      <div class="topbar-tabs" id="file-tabs">
        <!-- Tabs injected by JS -->
      </div>

      <div class="topbar-actions">
        <!-- New File -->
        <button class="btn btn-icon" id="btn-new" title="New File (Ctrl+Shift+N)">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <!-- Copy Code -->
        <button class="btn btn-icon" id="btn-copy" title="Copy Code" style="position:relative;">
          <svg class="icon-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <svg class="icon-tick" viewBox="0 0 24 24" style="stroke:var(--green);"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <!-- Font size -->
        <button class="btn btn-icon" id="btn-font-up" title="Increase Font Size">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="btn btn-icon" id="btn-font-down" title="Decrease Font Size">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>

        <!-- Run -->
        <button class="btn btn-run" id="btn-run" title="Run Code (Ctrl+Enter)">
          <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>
          <span class="btn-label">Run</span>
        </button>
        <!-- Stop -->
        <button class="btn btn-stop" id="btn-stop" title="Stop Execution" style="display:none;">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/></svg>
          <span class="btn-label">Stop</span>
        </button>
        <!-- Clear Output -->
        <button class="btn" id="btn-clear" title="Clear Output">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span class="btn-label">Clear</span>
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Editor Panel -->
      <div class="panel panel-editor" id="panel-editor">
        <div class="panel-header">
          <div class="panel-header-dot"></div>
          <span class="panel-header-title">Editor</span>
          <span class="panel-header-title" style="color:var(--yellow);margin-left:4px;">Python</span>
          <div class="panel-header-actions">
            <button class="btn btn-icon" id="btn-wrap" title="Toggle Word Wrap">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><path d="M3 6h18M3 12h15a3 3 0 1 1 0 6h-4"/><polyline points="13 16 10 19 13 22" transform="translate(0,-1)"/></svg>
            </button>
          </div>
        </div>
        <div class="editor-wrap" id="editor-container"></div>
      </div>

      <!-- Resize Handle -->
      <div class="resize-handle" id="resize-handle"></div>

      <!-- Output Panel -->
      <div class="panel panel-output" id="panel-output">
        <div class="panel-header">
          <div class="panel-header-dot" style="background:var(--cyan);box-shadow:0 0 6px var(--cyan);"></div>
          <span class="panel-header-title">Output</span>
          <div class="panel-header-actions">
            <button class="btn btn-icon" id="btn-clear-output" title="Clear Output">
              <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
        <div class="output-wrap" id="output">
          <div class="output-placeholder" id="output-placeholder">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
            <p>Press <kbd>Ctrl + Enter</kbd> or click <strong>Run</strong> to execute your Python code.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <footer class="statusbar">
      <div class="statusbar-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="status-state">Ready</span>
      </div>
      <div class="statusbar-item">
        <span>Python 3.11 (Pyodide)</span>
      </div>
      <div class="statusbar-item" id="status-cursor">Ln 1, Col 1</div>
      <div class="status-right">
        <div class="statusbar-item exec-timer" id="status-timer" style="display:none;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="timer-value">0.00s</span>
        </div>
        <div class="statusbar-item">
          <span>UTF-8</span>
        </div>
      </div>
    </footer>
  </div>

  <!-- Input dialog (for Python input()) -->
  <div class="input-overlay" id="input-overlay" style="display:none;">
    <div class="input-dialog">
      <label id="input-prompt-label">Enter input:</label>
      <input type="text" id="input-field" autocomplete="off" spellcheck="false" />
      <div class="input-hint">Press Enter to submit</div>
    </div>
  </div>

  <!-- New File dialog -->
  <div class="input-overlay" id="newfile-overlay" style="display:none;">
    <div class="input-dialog">
      <label>New Python File</label>
      <div style="display:flex;align-items:center;gap:0;">
        <input type="text" id="newfile-input" placeholder="filename" autocomplete="off" spellcheck="false" style="border-radius:6px 0 0 6px;" />
        <span style="padding:10px 12px;background:#1a2332;border:1px solid #1a2332;border-radius:0 6px 6px 0;color:#ffd600;font-size:.85rem;font-family:var(--font-mono);white-space:nowrap;">.py</span>
      </div>
      <div class="input-hint">Press Enter to create · Escape to cancel</div>
      <div id="newfile-error" style="margin-top:6px;font-size:.72rem;color:#ff1744;display:none;"></div>
    </div>
  </div>

  <!-- Monaco Editor + Pyodide -->
  <script defer src="script.js"></script>
</body>
</html>
